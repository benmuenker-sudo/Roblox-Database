<text x="96" y="736" fill="#1b2440" font-family="'DejaVu Sans', Verdana, Geneva, sans-serif" font-size="15" font-weight="400" text-anchor="start">Client: Spieler tippt „Kaufen“ → KaufWunsch:FireServer(„Schwert“). Sendet nur den Wunsch, keinen Preis.</text>
<circle cx="76" cy="758" r="11" fill="#7428d1" stroke="#ffffff" stroke-width="3" filter="url(#schattenK)"/>
<text x="76" y="762.18" fill="#ffffff" font-family="'DejaVu Sans', Verdana, Geneva, sans-serif" font-size="11.55" font-weight="700" text-anchor="middle">2</text>
<text x="96" y="764" fill="#1b2440" font-family="'DejaVu Sans', Verdana, Geneva, sans-serif" font-size="15" font-weight="400" text-anchor="start">Server: OnServerEvent → prüft Typ, Item existiert, genug Münzen, Cooldown. Preis kommt aus dem ModuleScript.</text>
<circle cx="76" cy="786" r="11" fill="#c9303f" stroke="#ffffff" stroke-width="3" filter="url(#schattenK)"/>
<text x="76" y="790.18" fill="#ffffff" font-family="'DejaVu Sans', Verdana, Geneva, sans-serif" font-size="11.55" font-weight="700" text-anchor="middle">3</text>
<text x="96" y="792" fill="#1b2440" font-family="'DejaVu Sans', Verdana, Geneva, sans-serif" font-size="15" font-weight="400" text-anchor="start">Server: Münzen abziehen, Item geben, per DataStore sichern (UpdateAsync, pcall).</text>
<circle cx="76" cy="814" r="11" fill="#1e9e55" stroke="#ffffff" stroke-width="3" filter="url(#schattenK)"/>
<text x="76" y="818.18" fill="#ffffff" font-family="'DejaVu Sans', Verdana, Geneva, sans-serif" font-size="11.55" font-weight="700" text-anchor="middle">4</text>
<text x="96" y="820" fill="#1b2440" font-family="'DejaVu Sans', Verdana, Geneva, sans-serif" font-size="15" font-weight="400" text-anchor="start">Server → Client: FireClient/Attribute → HUD zählt hoch, Erfolgs-Sound. ✘ Exploit-Aufruf „gib 1.000.000“ wird abgelehnt + geloggt.</text>
